# Pubblica il sito su GitHub Pages. Ogni lunedì (e a mano da «Actions → Run workflow») riscarica prima i dati delle fontanelle da OpenStreetMap.
# Impostazione una tantum: Settings → Pages → Source: «GitHub Actions», poi Custom domain (vedi docs/PAGES.md).
name: Pubblica il sito
on:
  push: { branches: [main] }
  schedule: [{ cron: '17 3 * * 1' }]
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Prove automatiche
        run: node test/geo.test.js && node test/i18n.test.js
      - name: Aggiorna i dati (ogni settimana, oppure se mancano)
        id: dati
        if: github.event_name != 'push' || hashFiles('data/t/index.json') == ''
        run: node tools/genera-tessere.mjs
      - name: Salva i dati nel repository
        if: steps.dati.outcome == 'success'
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data/t
          git diff --cached --quiet || (git commit -q -m "Dati aggiornati da OpenStreetMap [skip ci]" && git pull -q --rebase origin main && git push)
      - name: Prepara il sito
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='test' --exclude='tools' --exclude='art' --exclude='store' --exclude='docs' ./ _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
